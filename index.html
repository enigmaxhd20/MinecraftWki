<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineWiki — A enciclopédia não-oficial do Minecraft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand" onclick="navigate('home')">
      <div class="brand-mark"></div>
      <div class="brand-text"><b class="pixel" style="font-size:10px;">MineWiki</b><span>base de conhecimento</span></div>
    </div>

    <div class="side-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="Buscar artigos..." autocomplete="off">
    </div>

    <div class="nav-label">Categorias</div>
    <ul class="nav-list" id="categoryNav"></ul>

    <div class="side-footer">Site estático de demonstração.<br>Não afiliado à Mojang/Microsoft.</div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
